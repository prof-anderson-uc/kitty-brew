<!-- Reusable mural-style shapes, inlined into each mockup. Use with <svg><use href="#leaf"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- long soft leaf, like the big lavender shapes on the walls -->
    <symbol id="leaf" viewBox="0 0 200 90">
      <path d="M4 66 C38 14 118 -4 196 22 C152 50 84 84 4 66Z"/>
    </symbol>
    <!-- chunky leaf with a notch, like the pale shapes behind the cats -->
    <symbol id="leaf2" viewBox="0 0 160 160">
      <path d="M18 142 C10 86 40 28 112 10 C120 40 116 70 98 92 C126 88 146 96 152 108 C120 136 70 156 18 142Z"/>
    </symbol>
    <!-- round-petal yellow flower -->
    <symbol id="flower" viewBox="-100 -100 200 200">
      <g>
        <ellipse rx="25" ry="46" cy="-50"/><ellipse rx="25" ry="46" cy="-50" transform="rotate(45)"/>
        <ellipse rx="25" ry="46" cy="-50" transform="rotate(90)"/><ellipse rx="25" ry="46" cy="-50" transform="rotate(135)"/>
        <ellipse rx="25" ry="46" cy="-50" transform="rotate(180)"/><ellipse rx="25" ry="46" cy="-50" transform="rotate(225)"/>
        <ellipse rx="25" ry="46" cy="-50" transform="rotate(270)"/><ellipse rx="25" ry="46" cy="-50" transform="rotate(315)"/>
        <circle r="34"/>
      </g>
    </symbol>
    <!-- blunt 6-petal splash, like the periwinkle/orange shapes behind cats -->
    <symbol id="splat" viewBox="-100 -100 200 200">
      <g>
        <rect x="-24" y="-96" width="48" height="96" rx="24"/>
        <rect x="-22" y="-88" width="44" height="88" rx="22" transform="rotate(58)"/>
        <rect x="-25" y="-94" width="50" height="94" rx="25" transform="rotate(122)"/>
        <rect x="-22" y="-84" width="44" height="84" rx="22" transform="rotate(178)"/>
        <rect x="-24" y="-92" width="48" height="92" rx="24" transform="rotate(238)"/>
        <rect x="-21" y="-86" width="42" height="86" rx="21" transform="rotate(300)"/>
        <circle r="40"/>
      </g>
    </symbol>
    <!-- narrow-petal flower, like the sage one -->
    <symbol id="star" viewBox="-100 -100 200 200">
      <g>
        <ellipse rx="17" ry="48" cy="-48"/><ellipse rx="17" ry="48" cy="-48" transform="rotate(60)"/>
        <ellipse rx="17" ry="48" cy="-48" transform="rotate(120)"/><ellipse rx="17" ry="48" cy="-48" transform="rotate(180)"/>
        <ellipse rx="17" ry="48" cy="-48" transform="rotate(240)"/><ellipse rx="17" ry="48" cy="-48" transform="rotate(300)"/>
        <circle r="24"/>
      </g>
    </symbol>
    <!-- organic blob used as a photo mask -->
    <clipPath id="blobMask" clipPathUnits="objectBoundingBox">
      <path d="M.52 .02 C.74 .0 .95 .12 .98 .36 C1 .56 .93 .8 .74 .93 C.56 1.04 .3 .99 .14 .84 C-.02 .69 -.02 .42 .1 .24 C.2 .09 .36 .03 .52 .02Z"/>
    </clipPath>
  </defs>
</svg>
